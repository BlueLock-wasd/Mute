{% extends "base.html" %}

{% block title %}Главная{% endblock %}

{% block content %}
<div class="container">

    <!-- ===== HERO-СЕКЦИЯ ===== -->
    <div class="row mt-2 mb-5 text-center position-relative">
        <div class="col-12">
            <!-- Индикатор Sound On -->
            <div class="sound-indicator mb-2">
                <i class="bi bi-volume-up-fill"></i> Sound On
            </div>

            <!-- Реактивная аудиоволна -->
            <canvas id="visualizerCanvas" style="width: 100%; height: 120px; border-radius: 50px;"></canvas>

            <h2 class="mt-5 fw-light">Your Personalized Sonic Journey Begins.</h2>

            <!-- ===== ИНТЕРАКТИВНЫЙ ПОИСК ===== -->
            <div class="search-wrapper mt-4">
                <input type="text" class="search-input" placeholder="Впишите настроение, жанр или трек...">
            </div>

            <!-- ===== СТИЛЬНЫЙ CTA (Кнопка) ===== -->
            <div class="mt-4">
                <button class="btn btn-neon btn-lg px-5 py-3" onclick="playRandomMix()">
                    <i class="bi bi-music-note-beamed me-2"></i> Быстрый микс
                </button>
            </div>
        </div>
    </div>

    <!-- ===== СЕЙЧАС ПОПУЛЯРНО (горизонтальная сетка) ===== -->
    <div class="row mb-5">
        <div class="col-12">
            <h4 class="fw-bold mb-3">Сейчас популярно</h4>
            <div class="row g-3">
                {% for track in tracks[:6] %}
                <div class="col-6 col-md-4 col-lg-2">
                    <div class="trend-card" data-track-url="/static/{{ track.file_path }}" data-track-title="{{ track.title }}" data-track-artist="{{ track.artist }}">
                        <div class="trend-cover">
                            <div class="music-icon-box w-100 h-100" style="font-size: 32px;">🎵</div>
                        </div>
                        <div class="mt-2">
                            <div class="fw-bold small text-truncate">{{ track.title }}</div>
                            <div class="text-subdued small text-truncate">{{ track.artist }}</div>
                        </div>
                        <button class="btn btn-sm btn-outline-light rounded-circle trend-play" style="border-color: var(--neon-blue); color: var(--neon-blue); width: 30px; height: 30px; padding: 0;"
                                onclick="addToQueue('/static/{{ track.file_path }}', '{{ track.title }}', '{{ track.artist }}')">
                            <i class="bi bi-play-fill" style="font-size: 1rem;"></i>
                        </button>
                    </div>
                </div>
                {% else %}
                <div class="col-12 text-center text-muted">Нет треков</div>
                {% endfor %}
            </div>
        </div>
    </div>

    <!-- ===== MOOD CHIPS (Фильтры по настроению) ===== -->
    <div class="row mb-5">
        <div class="col-12">
            <h4 class="fw-bold mb-3">Mood Chips</h4>
            <div class="d-flex flex-wrap gap-2">
                <button class="mood-chip" onclick="playMood('focus')">Focus</button>
                <button class="mood-chip" onclick="playMood('chill')">Chill</button>
                <button class="mood-chip" onclick="playMood('cyberpunk')">Cyberpunk</button>
                <button class="mood-chip" onclick="playMood('night-drive')">Night Drive</button>
                <button class="mood-chip" onclick="playMood('lofi')">Lofi</button>
                <button class="mood-chip" onclick="playMood('electronic')">Electronic</button>
            </div>
        </div>
    </div>

</div>

<script>
    function playRandomMix() {
        // Играем случайный трек из всех доступных
        const tracks = document.querySelectorAll('[data-track-url]');
        if (tracks.length > 0) {
            const randomIndex = Math.floor(Math.random() * tracks.length);
            const track = tracks[randomIndex];
            addToQueue(track.dataset.trackUrl, track.dataset.trackTitle, track.dataset.trackArtist);
        }
    }

    function playMood(mood) {
        // Логика для запуска радио-потока по настроению
        console.log('Запускаем поток для настроения:', mood);
        // Здесь можно добавить фильтрацию треков по жанру из базы
    }
</script>
{% endblock %}

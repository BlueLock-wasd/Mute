{% extends "base.html" %}

{% block title %}Библиотека - MUTE{% endblock %}

{% block content %}
<canvas id="visualizerCanvas" style="width: 100%; height: 80px;"></canvas>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-music-note-list"></i> Все треки</h2>
        <a href="{{ url_for('upload_track') }}" class="btn btn-neon">
            <i class="bi bi-plus-circle"></i> Загрузить
        </a>
    </div>
    <div class="row g-4">
    {% for track in tracks %}
    <div class="col-md-4">
        <div class="glass-card p-3 h-100"
             data-track-url="/static/{{ track.file_path }}"
             data-track-title="{{ track.title }}"
             data-track-artist="{{ track.artist }}"
             data-track-cover="{{ url_for('static', filename=track.cover_path) }}">

            <div class="d-flex align-items-center mb-3">
                <div style="width: 60px; height: 60px; border-radius: 12px; overflow: hidden; margin-right: 15px; flex-shrink: 0;">
                    <img src="{{ url_for('static', filename=track.cover_path) }}"
                         alt="{{ track.title }}"
                         style="width: 100%; height: 100%; object-fit: cover;"
                         onerror="this.src='{{ url_for('static', filename='images/covers_default/default_1.jpg') }}'">
                </div>
                <div>
                    <h5 class="mb-0 fw-bold">{{ track.title }}</h5>
                    <small class="text-muted">{{ track.artist }}</small>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-3">
                <span class="badge bg-secondary">{{ track.genre }}</span>
                <small class="text-muted">
                    <i class="bi bi-person-circle"></i> {{ track.author.username }}
                </small>
            </div>

            <div class="mt-3">
                <button class="btn btn-outline-light w-100" style="border-color: var(--neon-blue); color: var(--neon-blue);"
                        onclick="addToQueue('/static/{{ track.file_path }}', '{{ track.title }}', '{{ track.artist }}')">
                    <i class="bi bi-play-circle"></i> Слушать
                </button>
            </div>
        </div>
    </div>
    {% endfor %}
    </div>
</div>
{% endblock %}
